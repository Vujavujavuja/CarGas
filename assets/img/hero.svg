<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Ilustracija benzinske pumpe u banatskoj ravnici u sumrak">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1f36"/>
      <stop offset=".55" stop-color="#1c4a73"/>
      <stop offset=".82" stop-color="#e98a3c"/>
      <stop offset="1" stop-color="#ffcf6b"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3a22"/>
      <stop offset="1" stop-color="#16170f"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d33"/>
      <stop offset="1" stop-color="#121417"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy="0" r=".9">
      <stop offset="0" stop-color="#fff6d6" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff6d6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="720" fill="url(#sky)"/>
  <circle cx="930" cy="470" r="70" fill="#ffd98a" opacity=".85"/>

  <!-- wind turbines on the Banat horizon -->
  <g stroke="#0b1f36" stroke-linecap="round" opacity=".75">
    <g transform="translate(140 300)"><line x1="0" y1="0" x2="0" y2="200" stroke-width="5"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/><line x1="0" y1="0" x2="0" y2="-62" stroke-width="4"/><line x1="0" y1="0" x2="54" y2="31" stroke-width="4"/><line x1="0" y1="0" x2="-54" y2="31" stroke-width="4"/></g></g>
    <g transform="translate(270 340) scale(.75)"><line x1="0" y1="0" x2="0" y2="215" stroke-width="5"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/><line x1="0" y1="0" x2="0" y2="-62" stroke-width="4"/><line x1="0" y1="0" x2="54" y2="31" stroke-width="4"/><line x1="0" y1="0" x2="-54" y2="31" stroke-width="4"/></g></g>
    <g transform="translate(1080 320) scale(.85)"><line x1="0" y1="0" x2="0" y2="210" stroke-width="5"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/><line x1="0" y1="0" x2="0" y2="-62" stroke-width="4"/><line x1="0" y1="0" x2="54" y2="31" stroke-width="4"/><line x1="0" y1="0" x2="-54" y2="31" stroke-width="4"/></g></g>
  </g>

  <!-- flat plain -->
  <path d="M0 500 L1200 500 L1200 720 L0 720z" fill="url(#field)"/>
  <path d="M0 500 Q300 492 600 500 T1200 498 L1200 506 L0 506z" fill="#4a4a2a"/>

  <!-- road -->
  <path d="M0 640 L1200 600 L1200 720 L0 720z" fill="url(#road)"/>
  <path d="M0 682 L1200 650" stroke="#ffc21a" stroke-width="4" stroke-dasharray="40 30" opacity=".8"/>

  <!-- station building -->
  <rect x="760" y="430" width="260" height="140" fill="#e9edf2"/>
  <rect x="760" y="420" width="260" height="20" fill="#0e2a47"/>
  <rect x="790" y="470" width="80" height="60" fill="#ffd98a" opacity=".9"/>
  <rect x="890" y="470" width="50" height="100" fill="#1c4a73"/>
  <rect x="955" y="470" width="45" height="60" fill="#ffd98a" opacity=".9"/>

  <!-- canopy light -->
  <path d="M300 410 L700 410 L760 610 L240 610z" fill="url(#glow)" opacity=".55"/>

  <!-- canopy -->
  <rect x="300" y="360" width="400" height="44" rx="4" fill="#0e2a47"/>
  <rect x="300" y="398" width="400" height="12" fill="#ffc21a"/>
  <text x="500" y="392" text-anchor="middle" font-family="'Barlow Condensed', Arial Narrow, sans-serif" font-weight="800" font-size="32" letter-spacing="6" fill="#ffc21a">CAR GAS</text>
  <rect x="340" y="410" width="12" height="190" fill="#c9d1db"/>
  <rect x="648" y="410" width="12" height="190" fill="#c9d1db"/>

  <!-- pumps -->
  <g>
    <rect x="410" y="500" width="54" height="100" rx="6" fill="#ffc21a"/>
    <rect x="418" y="510" width="38" height="24" rx="3" fill="#0e2a47"/>
    <rect x="422" y="515" width="30" height="5" fill="#7fe0a0"/>
    <rect x="536" y="500" width="54" height="100" rx="6" fill="#ffc21a"/>
    <rect x="544" y="510" width="38" height="24" rx="3" fill="#0e2a47"/>
    <rect x="548" y="515" width="30" height="5" fill="#7fe0a0"/>
    <rect x="400" y="598" width="200" height="10" rx="3" fill="#8a94a1"/>
  </g>

  <!-- price pylon -->
  <g>
    <rect x="1085" y="420" width="10" height="190" fill="#8a94a1"/>
    <rect x="1040" y="330" width="100" height="120" rx="6" fill="#0e2a47"/>
    <rect x="1040" y="330" width="100" height="26" rx="6" fill="#ffc21a"/>
    <rect x="1052" y="368" width="76" height="14" rx="2" fill="#7fe0a0" opacity=".85"/>
    <rect x="1052" y="390" width="76" height="14" rx="2" fill="#7fe0a0" opacity=".85"/>
    <rect x="1052" y="412" width="76" height="14" rx="2" fill="#7fe0a0" opacity=".85"/>
  </g>

  <!-- car -->
  <g transform="translate(110 590)">
    <path d="M0 40 Q4 18 40 14 L70 0 L150 0 L185 16 Q215 20 220 40 L220 52 L0 52z" fill="#d9472b"/>
    <path d="M78 6 L144 6 L170 18 L64 18z" fill="#a8c6e6" opacity=".8"/>
    <circle cx="45" cy="54" r="16" fill="#111"/><circle cx="45" cy="54" r="6" fill="#888"/>
    <circle cx="178" cy="54" r="16" fill="#111"/><circle cx="178" cy="54" r="6" fill="#888"/>
    <rect x="206" y="30" width="14" height="8" rx="2" fill="#fff3b0"/>
  </g>
</svg>
